version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # For production, enable auth by uncommenting and setting these,
    # then update MONGO_URL in backend .env accordingly:
    # environment:
    #   MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
    #   MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - mongo_data:/data/db
    # Do NOT publish 27017 publicly in production. Keep it on the internal network.
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "8001"
    # Publish only if you are NOT fronting with an external reverse proxy.
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the static bundle at build time.
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo_data:
